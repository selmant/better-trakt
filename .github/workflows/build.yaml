name: Build Better Trakt

on:
  push:
    branches:
      - better-trakt
  pull_request:
    branches:
      - better-trakt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Trakt.sln

      - name: Build
        run: dotnet build Trakt.sln --configuration Release --no-restore --warnaserror
