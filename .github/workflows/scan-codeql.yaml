name: '🔬 Run CodeQL'

on:
  push:
    branches: [ better-trakt ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ better-trakt ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@bd147a5ba80bc60d6c94f8842afe716f6a2f626a # master
    with:
      repository-name: selmant/better-trakt
