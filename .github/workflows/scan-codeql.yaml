name: '🔬 Run CodeQL'

on:
  push:
    branches: [ better-trakt ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ better-trakt ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@9b367ad7b96c2a5e0ce27675815bc9755ae0a971 # master
    with:
      repository-name: selmant/better-trakt
