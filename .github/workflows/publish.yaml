name: Publish Better Trakt

on:
  release:
    types:
      - released

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x

      - name: Build Jellyfin plugin package
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        with:
          dotnet-target: net9.0

      - name: Upload package for publishing
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: better-trakt-package
          if-no-files-found: error
          path: ${{ steps.jprm.outputs.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: better-trakt-package

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./*.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one plugin ZIP, found ${#packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          md5sum "${package#./}" > "${package%.zip}.md5"
          sha256sum "${package#./}" > "${package%.zip}.sha256"

      - name: Attach package to GitHub release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./*.zip
            ./*.md5
            ./*.sha256

  manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: better-trakt-package

      - name: Check out manifest branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: manifest-release
          path: repository

      - name: Update Jellyfin repository manifest
        shell: bash
        env:
          CHANGELOG: ${{ github.event.release.body }}
          RELEASE_TIMESTAMP: ${{ github.event.release.published_at }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          shopt -s nullglob
          packages=(./*.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one plugin ZIP, found ${#packages[@]}" >&2
            exit 1
          fi

          package="${packages[0]}"
          package_name="${package#./}"
          version="${RELEASE_TAG#v}"
          checksum="$(md5sum "${package}" | awk '{print $1}')"
          source_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${package_name}"
          unzip -p "${package}" meta.json > /tmp/better-trakt-meta.json

          jq \
            --slurpfile meta /tmp/better-trakt-meta.json \
            --arg changelog "${CHANGELOG}" \
            --arg checksum "${checksum}" \
            --arg sourceUrl "${source_url}" \
            --arg timestamp "${RELEASE_TIMESTAMP}" \
            --arg version "${version}" \
            '
              ($meta[0]) as $plugin
              | ((.[0] // {}).versions // []) as $previousVersions
              | [{
                  category: $plugin.category,
                  description: $plugin.description,
                  guid: $plugin.guid,
                  name: $plugin.name,
                  overview: $plugin.overview,
                  owner: $plugin.owner,
                  versions: ([{
                    changelog: $changelog,
                    checksum: $checksum,
                    sourceUrl: $sourceUrl,
                    targetAbi: $plugin.targetAbi,
                    timestamp: $timestamp,
                    version: $version
                  }] + ($previousVersions | map(select(.version != $version))))
                }]
            ' repository/manifest.json > repository/manifest.json.next
          mv repository/manifest.json.next repository/manifest.json

      - name: Publish manifest branch
        working-directory: repository
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest is already current"
            exit 0
          fi
          git commit -m "Publish ${GITHUB_REF_NAME} plugin manifest"
          git push origin HEAD:manifest-release
